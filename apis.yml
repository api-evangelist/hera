name: Hera
description: 'Hera is a Medicare-covered care-management company that pairs families with dedicated
  senior-care experts (called "Heroes") to coordinate healthcare for aging parents. Heroes handle
  Medicare/Medicaid and insurance navigation, appointment and medical coordination, pharmacy and
  benefits administration, and ongoing chronic-care support, with most families paying $0 out of
  pocket because services are covered by Original Medicare. Founded by Jenny Lee after a personal
  family dementia-caregiving experience, Hera augments its human care coordinators with an internal
  AI platform ("Juno") and is backed by Accel and Bain Capital Ventures. As of this enrichment pass
  Hera operates a consumer (B2C) healthcare service and publishes no public developer portal, API,
  or specification surface, so the technical-artifact tiers of the enrichment pipeline are not
  applicable.'
